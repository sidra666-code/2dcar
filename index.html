<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>2D Araba Oyunu</title>
<style>
html,body{margin:0;overflow:hidden;background:#222;font-family:Arial}
canvas{display:block;touch-action:none}
#menu,#gameover,#count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.45)}
#gameover,#count{display:none}button{padding:14px 28px;font-size:22px}
#hud{position:absolute;top:10px;left:10px;color:#fff;font-size:22px}
</style></head><body>
<div id=hud>Skor <span id=s>0</span><br>Rekor <span id=r>0</span></div>
<div id=menu><h1>2D Araba Oyunu</h1><button onclick="startGame()">Başla</button></div>
<div id=count><h1 id=ct>3</h1></div>
<div id=gameover><h1>Oyun Bitti</h1><button onclick="location.reload()">Yeniden Başla</button></div>
<canvas id=c></canvas>
<script>
const cv=c,ctx=cv.getContext('2d');function rs(){cv.width=innerWidth;cv.height=innerHeight}onresize=rs;rs();
let rec=+localStorage.record||0;r.textContent=rec;
let car=new Image();car.src='yesil.png';let obsimg=new Image();obsimg.src='engel.png';
let started=false,over=false,t0,speed=4,road=320,px=cv.width/2,obs=[];
function startGame(){menu.style.display='none';count.style.display='flex';let n=3;ct.textContent=n;let i=setInterval(()=>{n--;if(n){ct.textContent=n}else{clearInterval(i);count.style.display='none';started=true;t0=Date.now();loop();}},1000)}
function spawn(){obs.push({x:(cv.width-road)/2+20+Math.random()*(road-60),y:-90})}
let last=0;
function loop(){
 if(!started||over)return;
 requestAnimationFrame(loop);
 let sec=(Date.now()-t0)/1000;s.textContent=Math.floor(sec);
 speed=Math.min(4+sec*0.15,18);
 ctx.fillStyle="#2b8a3e";ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle="#555";ctx.fillRect((cv.width-road)/2,0,road,cv.height);
 ctx.strokeStyle="#fff";ctx.setLineDash([30,20]);ctx.lineDashOffset=-sec*speed*30;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(cv.width/2,0);ctx.lineTo(cv.width/2,cv.height);ctx.stroke();ctx.setLineDash([]);
 if(Date.now()-last>Math.max(250,900-sec*10)){spawn();last=Date.now();}
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=speed+4;ctx.drawImage(obsimg,o.x,o.y,50,80);
 if(px<o.x+50&&px+60>o.x&&cv.height-140<o.y+80&&cv.height-40>o.y){over=true;gameover.style.display='flex';if(Math.floor(sec)>rec){localStorage.record=Math.floor(sec);}}
 if(o.y>cv.height+100)obs.splice(i,1);}
 ctx.drawImage(car,px,cv.height-140,60,100);
}
function mv(x){let l=(cv.width-road)/2,r=l+road-60;px=Math.max(l,Math.min(r,x-30));}
cv.onpointerdown=e=>mv(e.clientX);cv.onpointermove=e=>{if(e.buttons||e.pressure)mv(e.clientX);}
</script></body></html>
