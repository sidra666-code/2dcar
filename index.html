<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Araba Oyunu</title>

<style>

html,body{
margin:0;
overflow:hidden;
background:#222;
touch-action:none;
}

canvas{
display:block;
background:#5f5f5f;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-size:24px;
font-family:Arial;
font-weight:bold;
z-index:5;
text-shadow:2px 2px 5px black;
}

#gameover{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:none;
text-align:center;
color:white;
font-family:Arial;
z-index:10;

}

button{

padding:15px 35px;
font-size:22px;
border:none;
border-radius:10px;
background:#27ae60;
color:white;

}

h1{

margin-bottom:20px;

}

</style>

</head>
<body>

<div id="ui">

Skor :
<span id="score">0</span>

<br>

Rekor :
<span id="record">0</span>

</div>

<div id="gameover">

<h1>OYUN BİTTİ</h1>

<button onclick="restart()">Yeniden Başla</button>

</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);

const carImg=new Image();
carImg.src="yesil.png";

const engelImg=new Image();
engelImg.src="engel.png";

let roadWidth=300;

let car={
x:innerWidth/2-35,
y:innerHeight-140,
w:70,
h:110
};

let obstacles=[];

let score=0;

let record=localStorage.getItem("record")||0;

document.getElementById("record").innerHTML=record;

let gameOver=false;

let lastSpawn=0;

let startTime=Date.now();

let roadOffset=0;

function spawn(){

let x=(innerWidth-roadWidth)/2+
Math.random()*(roadWidth-60);

obstacles.push({

x:x,
y:-120,
w:60,
h:90

});

}

function update(){

if(gameOver)return;

score=Math.floor((Date.now()-startTime)/1000);

document.getElementById("score").innerHTML=score;

roadOffset+=8;

if(Date.now()-lastSpawn>900){

spawn();

lastSpawn=Date.now();

}

for(let i=obstacles.length-1;i>=0;i--){

let o=obstacles[i];

o.y+=10;

if(

car.x<o.x+o.w&&
car.x+car.w>o.x&&
car.y<o.y+o.h&&
car.y+car.h>o.y

){

gameOver=true;

document.getElementById("gameover").style.display="block";

if(score>record){

record=score;

localStorage.setItem("record",record);

document.getElementById("record").innerHTML=record;

}

}

if(o.y>innerHeight+100){

obstacles.splice(i,1);

}

}

}

function drawRoad(){

ctx.fillStyle="#444";

ctx.fillRect((innerWidth-roadWidth)/2,0,roadWidth,innerHeight);

ctx.strokeStyle="white";

ctx.lineWidth=8;

ctx.setLineDash([40,30]);

ctx.lineDashOffset=roadOffset;

ctx.beginPath();

ctx.moveTo(innerWidth/2,0);

ctx.lineTo(innerWidth/2,innerHeight);

ctx.stroke();

ctx.setLineDash([]);

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

drawRoad();

ctx.drawImage(carImg,car.x,car.y,car.w,car.h);

for(let o of obstacles){

ctx.drawImage(engelImg,o.x,o.y,o.w,o.h);

}

}

function loop(){

update();

draw();

requestAnimationFrame(loop);

}

loop();

let dragging=false;

function move(px){

let left=(innerWidth-roadWidth)/2;

let right=left+roadWidth-car.w;

car.x=px-car.w/2;

if(car.x<left)car.x=left;

if(car.x>right)car.x=right;

}

canvas.addEventListener("touchstart",e=>{

dragging=true;

move(e.touches[0].clientX);

});

canvas.addEventListener("touchmove",e=>{

if(!dragging)return;

move(e.touches[0].clientX);

});

canvas.addEventListener("touchend",()=>{

dragging=false;

});

canvas.addEventListener("mousedown",e=>{

dragging=true;

move(e.clientX);

});

canvas.addEventListener("mousemove",e=>{

if(!dragging)return;

move(e.clientX);

});

canvas.addEventListener("mouseup",()=>{

dragging=false;

});

function restart(){

obstacles=[];

score=0;

startTime=Date.now();

gameOver=false;

document.getElementById("gameover").style.display="none";

car.x=innerWidth/2-car.w/2;

}

</script>

</body>
</html>
