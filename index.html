
<!doctype html><html lang='tr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,user-scalable=no'>
<style>html,body{margin:0;overflow:hidden;background:#3a8f3a}canvas{display:block}#ui,#menu,#over,#count{position:absolute;inset:0}#hud{position:absolute;left:10px;top:10px;color:#fff;font:20px Arial}#menu,#over,#count{display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.45);color:#fff}#over,#count{display:none}button{padding:12px 24px;font-size:22px}</style></head><body>
<div id=hud>Skor <span id=sc>0</span><br>Rekor <span id=rc>0</span></div>
<div id=menu><h1>Araba Oyunu</h1><button onclick='go()'>Başla</button></div><div id=count><h1 id=num>3</h1></div><div id=over><h1>Oyun Bitti</h1><button onclick='location.reload()'>Yeniden Başla</button></div>
<canvas id=cv></canvas><script>
let c=cv,x=c.getContext('2d');function rs(){c.width=innerWidth;c.height=innerHeight}onresize=rs;rs();
let carI=new Image(),obsI=new Image(),carOk=0,obsOk=0;carI.onload=()=>carOk=1;obsI.onload=()=>obsOk=1;carI.src='yesil.png';obsI.src='engel.png';
let rec=+localStorage.record||0;rc.textContent=rec;
let road=320,px=0,obs=[],t0,spd=5,last=0,run=0;
function go(){menu.style.display='none';count.style.display='flex';let n=3;num.textContent=n;let iv=setInterval(()=>{n--;if(n){num.textContent=n}else{clearInterval(iv);count.style.display='none';run=1;px=c.width/2-30;t0=Date.now();loop();}},1000)}
function spawn(){obs.push({x:(c.width-road)/2+20+Math.random()*(road-70),y:-90})}
function drawCar(){if(carOk)x.drawImage(carI,px,c.height-120,60,100);else{x.fillStyle='lime';x.fillRect(px,c.height-120,60,100)}}
function drawObs(o){if(obsOk)x.drawImage(obsI,o.x,o.y,50,80);else{x.fillStyle='red';x.fillRect(o.x,o.y,50,80)}}
function loop(){if(!run)return;requestAnimationFrame(loop);let s=(Date.now()-t0)/1000;sc.textContent=s|0;spd=Math.min(6+s*.18,20);
x.fillStyle='#2e8b57';x.fillRect(0,0,c.width,c.height);
let L=(c.width-road)/2,R=L+road;
for(let y=-40;y<c.height;y+=80){x.fillStyle='#888';x.fillRect(L-12,y,12,50);x.fillRect(R,y,12,50);}
for(let y=-30;y<c.height;y+=120){x.fillStyle='#0b5';x.beginPath();x.arc(L-35,(y+s*spd*20)% (c.height+120)-60,14,0,7);x.arc(R+35,(y+s*spd*20)% (c.height+120)-60,14,0,7);x.fill();x.fillStyle='#654321';x.fillRect(L-38,((y+s*spd*20)%(c.height+120))-46,6,16);x.fillRect(R+32,((y+s*spd*20)%(c.height+120))-46,6,16);}
x.fillStyle='#555';x.fillRect(L,0,road,c.height);x.strokeStyle='#fff';x.lineWidth=5;for(let y=(s*spd*30)%60-60;y<c.height;y+=60){x.beginPath();x.moveTo(c.width/2,y);x.lineTo(c.width/2,y+30);x.stroke();}
if(Date.now()-last>Math.max(250,900-s*8)){spawn();last=Date.now();}
for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=spd+4;drawObs(o);if(px<o.x+50&&px+60>o.x&&c.height-120<o.y+80&&c.height-20>o.y){run=0;over.style.display='flex';if((s|0)>rec){localStorage.record=s|0;rc.textContent=s|0;}}if(o.y>c.height+90)obs.splice(i,1)}
drawCar();}
cv.onpointerdown=e=>mv(e.clientX);cv.onpointermove=e=>{if(e.buttons||e.pressure)mv(e.clientX)}
function mv(xx){let L=(c.width-road)/2,R=L+road-60;px=Math.max(L,Math.min(R,xx-30));}
</script></body></html>
